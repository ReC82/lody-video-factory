# Extrait nginx pour /etc/nginx/sites-available/video.lodylands.com — voir docs/lody-auth.md.
#
# NE PAS appliquer avant validation du déploiement (ticket #28). Une fois copié :
#   sudo nginx -t && sudo systemctl reload nginx
#
# 1. Zone de limitation de débit : à ajouter dans /etc/nginx/nginx.conf, bloc http { } (PAS dans le vhost —
#    limit_req_zone doit être déclarée au niveau http). Défense en profondeur : le service lody-auth a déjà
#    son propre verrouillage anti-force-brute en mémoire (voir lody_auth/store.py) ; ceci arrête aussi un
#    simple déluge de requêtes avant qu'il n'atteigne le service.
#
#     limit_req_zone $binary_remote_addr zone=lody_auth_login:10m rate=5r/m;
#
# 2. Dans le bloc `server { server_name video.lodylands.com; ... }`, AVANT le `location / { ... }` existant
#    (proxy_pass http://127.0.0.1:8601 ; NE PAS LE MODIFIER) :

    # Service d'authentification admin (Paramètres système) : /login, /logout — jamais /verify (interne
    # uniquement, atteint par Lody via le réseau Docker, pas par nginx).
    location /lody-auth/ {
        limit_req zone=lody_auth_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8602/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /verify n'est JAMAIS exposé publiquement : Lody l'appelle en interne (réseau Docker), jamais via nginx.
    location = /lody-auth/verify {
        return 404;
    }
