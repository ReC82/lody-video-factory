name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "README*.md"
      - "docs/**"
      # Ce fichier n'est plus exclu : une modification de la cible de publication ou des identifiants doit
      # déclencher une publication réelle, sinon la correction ne peut pas être vérifiée avant le prochain
      # changement de code.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  # Image canonique de Lody Video Factory, dans le namespace GHCR DE CE DÉPÔT : c'est la seule cible que le
  # GITHUB_TOKEN du dépôt (permission packages: write ci-dessus) a le droit d'écrire. L'ancienne valeur
  # (namespace historique de l'upstream) provoquait à chaque push sur main :
  #   denied: permission_denied: The requested installation does not exist
  # Tout en MINUSCULES : GHCR refuse les majuscules, alors que ${{ github.repository_owner }} vaut « ReC82 ».
  # Littéral volontaire (et non une expression) pour qu'une validation statique puisse le vérifier —
  # voir test/lody/test_no_legacy_namespace.py.
  IMAGE_NAME: ghcr.io/rec82/lody-video-factory

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `type=sha,format=short` reprend la convention d'étiquette du déploiement
      # (LODY_IMAGE_TAG=$(git rev-parse --short HEAD), voir docs/lody-ui.md) : un tag publié correspond donc
      # à un tag déployable. Aucun commentaire DANS le bloc `tags:` ci-dessous — chaque ligne y est une
      # définition de tag, pas du YAML.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Image de Lody Video Factory (interface du projet, webui/Lody.py), et non l'ancienne image du
          # moteur MoneyPrinterTurbo construite depuis ./Dockerfile : c'est ce dépôt-ci que ce workflow
          # publie. Le moteur reste un service distinct, construit localement
          # (docker-compose.engine-local.yml) — il n'est pas publié ici.
          file: ./Dockerfile.lody
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
