name: CI

# #198 : CI ciblée par PR. Résumé (détail et tableau « quel changement déclenche quoi » :
# docs/ci-tests-cibles.md) :
# - le job « Detect code changes » classe les fichiers de la PR avec scripts/ci/select_tests.py
#   (testé par test/lody/test_ci_workflow.py) : docs / ciblé (interface Lody, orchestrateur) / complet ;
#   tout fichier non reconnu, un diff illisible ou vide donne la suite COMPLÈTE ;
# - sur PR, un seul job de tests en Python 3.12, version de production (Dockerfile.lody) ;
# - push sur main, programmation hebdomadaire et lancement manuel : suite complète en 3.11, 3.12 et 3.13 ;
# - le job « CI result » agrège tout : c'est LE check à exiger pour fusionner (#193). Il échoue si un job
#   nécessaire échoue ou est annulé, et ne peut pas être vert si la classification a échoué.
# Retour arrière : restaurer ce fichier depuis l'historique (git checkout <sha> -- .github/workflows/ci.yml).

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Suite complète hebdomadaire (lundi 03:17 UTC) sur main, même sans nouveau commit.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Un nouveau push sur une PR annule le run précédent devenu inutile ; jamais sur main.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      tests: ${{ steps.select.outputs.tests }}
      pythons: ${{ steps.select.outputs.pythons }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select tests from changed files
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci/select_tests.py --event "$EVENT" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT" | tee selection.txt
          { echo '### Sélection des tests (#198)'; echo '```'; cat selection.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Python ${{ matrix.python-version }} tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.changes.outputs.pythons) }}

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MPT_TEST_REDIS_HOST: 127.0.0.1
      MPT_TEST_REDIS_PORT: 6379
      MPT_TEST_REDIS_DB: 15
      MODE: ${{ needs.changes.outputs.mode }}
      TESTS: ${{ needs.changes.outputs.tests }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      # Compilation et lint portent TOUJOURS sur tout le dépôt (≈ 1 s) : une PR ciblée ne peut pas casser
      # la syntaxe ou le style d'un autre module sans être vue.
      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q app cli.py main.py webui test scripts/ci

      - name: Lint Python sources
        if: matrix.python-version == '3.12'
        run: uv run --no-sync ruff check app cli.py main.py webui test scripts/ci

      # Suites ciblées en parallèle borné (pytest-xdist, au plus 4 processus = vCPU d'un runner standard) :
      # test/lody et test/lodyorch ont été vérifiés sans conflit sous xdist (#198, docs/ci-tests-cibles.md).
      - name: Run selected tests (${{ needs.changes.outputs.mode }})
        if: needs.changes.outputs.mode != 'full'
        run: uv run --no-sync python -X utf8 -m pytest -q -n auto --maxprocesses 4 --durations=15 $TESTS

      # Suite complète : en série, couverture et seuil fail_under (pyproject.toml) conservés. Pas de xdist ici :
      # test/services partage une base Redis de test et n'a pas été vérifié en parallèle.
      - name: Run full test suite with coverage
        if: needs.changes.outputs.mode == 'full'
        run: uv run --no-sync python -X utf8 -m coverage run -m pytest -q --durations=15 test

      - name: Report test coverage
        if: needs.changes.outputs.mode == 'full'
        run: uv run --no-sync python -m coverage report

      - name: Export coverage report
        if: needs.changes.outputs.mode == 'full'
        run: uv run --no-sync python -m coverage xml

      - name: Upload coverage report
        if: needs.changes.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  windows-smoke:
    name: Windows smoke tests
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.12

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q app cli.py main.py webui test

      - name: Run core service smoke tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_config.py
          test/services/test_state.py
          test/services/test_task.py
          test/services/test_task_manager.py
          test/services/test_upload_post.py
          test/services/test_controller_video.py
          test/services/test_webui_task.py
          test/services/test_audio_assets.py
          test/services/test_controller_audio_assets.py

  # Check unique à rendre obligatoire (protection de branche, fusion automatique #193). Il tourne même si
  # un job a échoué ou a été sauté, et n'est vert que si : la classification a réussi, les tests ont
  # réussi, et le smoke Windows a réussi (ou a été sauté parce que la PR est ciblée).
  ci-result:
    name: CI result
    needs: [changes, tests, windows-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.tests.result }}
          WINDOWS: ${{ needs.windows-smoke.result }}
        run: |
          echo "mode=$MODE changes=$CHANGES tests=$TESTS windows-smoke=$WINDOWS"
          case "$MODE" in docs|targeted|full) ;; *) echo "Classification absente ou invalide."; exit 1 ;; esac
          [ "$CHANGES" = success ] || { echo "Classification en échec."; exit 1; }
          [ "$TESTS" = success ] || { echo "Tests en échec ou non lancés."; exit 1; }
          if [ "$MODE" = full ]; then
            [ "$WINDOWS" = success ] || { echo "Smoke Windows en échec ou non lancé."; exit 1; }
          else
            [ "$WINDOWS" = skipped ] || { echo "Smoke Windows inattendu : $WINDOWS."; exit 1; }
          fi
          echo "CI verte pour le mode $MODE."
